<!DOCTYPE html>
<html>
<head>
    <title>Comment Filter</title>
</head>

<body>
    <p id="display"></p>

    <script>

        function filterComment(comment) {

            let bannedWords = /bad|ugly|stupid/gi;

            let cleanedComment = comment.replace(bannedWords, "***");

            let numbers = comment.match(/\d+/g);

            let numberCount = numbers ? numbers.length : 0;


            let capitalWords = comment.match(/\b[A-Z][a-z]*\b/g);

            let capitalWordCount = capitalWords ? capitalWords.length : 0;

            return "Cleaned comment: " + cleanedComment +
                   "<br>Number count: " + numberCount +
                   "<br>Capitalized word count: " + capitalWordCount;
        }


        let comment = "I think this movie was BAD and 100% Stupid! But the Acting was Amazing and 3 actors were great.";

        document.getElementById("display").innerHTML = filterComment(comment);

    </script>

</body>
</html>
