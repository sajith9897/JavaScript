<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smallest Number</title>
</head>
<body>
    <script>
        let arr = [46,55,36,87,97,34,54,24];

        let smallest = arr[0];

        for (let i=0; i<arr.length; i++) {
            if (smallest > arr[i] ) {
                smallest = arr [i]
            }
        }
        console.log (smallest)
    </script>
        
</body>
