<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <p id="para">Hello World</p>
    <input type="text" name="text" id="inputTxt" style="display: none;">

    <script>
        var text= document.getElementById("para");
        var input = document.getElementById("inputTxt")

        text.addEventListener('dblclick', display)

        function display() {
            input.value = text.innerHTML;
            text.style.display = 'none';
            input.style.display= 'inline';
            input.focus();
        }

        input.addEventListener('blur',inputDisplay)

        function inputDisplay(){
            text.innerHTML=input.value;
            input.style.display='none';
            text.style.display='block'

        }

    </script>
</body>
</html>
