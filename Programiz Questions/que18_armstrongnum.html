<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Armstrong Number</title>
</head>
<body>
    <script>
        let num = parseFloat (prompt(`Enter the first number: `));
        let sum = 0;
        let og= num
        while (num>0){
            let digit = num%10;
            sum += digit*digit*digit;
            num = Math.floor(num/10);
        }
        if (sum==og) {
            console.log(`${og} is a Armstrong number`)
        }
        else {
            console.log(`${og} is not a Armstrong number`)
        }
        
        
    </script>
</body>
</html>
