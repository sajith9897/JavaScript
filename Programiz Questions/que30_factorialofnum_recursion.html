<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Factorial of number using recursion</title>
</head>
<body>
    <script>
        function factorial (a) {
            if (a > 0) {
               return a * factorial(a-1);
            }
            else {
                return 1;
            }
        }

        let inp = parseInt(prompt(`Enter the number: `))

        console.log (factorial(inp))

    </script>
</body>
</html>
