<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Two Numbers</title>
</head>
<body>
    <input type="number" name="num1" id="inputNum1" placeholder="First Number:">
    <input type="number" name="num2" id="inputNum2" placeholder="Second Number: ">
    <button onclick="sumFunction()">Enter</button>
    <p id="display"></p>

    <script>
        function sumFunction() {
            let num1 = parseInt(inputNum1.value);
            let num2 = parseInt(inputNum2.value);
            let sum = num1 + num2;
            
            document.getElementById("display").innerHTML= `The sum of ${num1} and ${num2} is: ${sum}`;

        }

        
    </script>
</body>
</html>
