<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Calculator</title>
</head>
<body>
    <script>
        let operator = prompt(`Enter the operator ('+' or '-' or '*' or '/' ): `);
        let num1 = parseFloat (prompt(`Enter the first number: `));
        let num2 = parseFloat (prompt(`Enter the second number: `));
        let result;
        
        if (operator == "+") {
            result = num1 + num2;
        }
        else if (operator == "-") {
            result = num1 - num2;
        }
        else if (operator == "*") {
            result = num1*num2;
        }
        else if (operator == "/") {
            result = num1/num2;
        }
        else {
            result= ("Not a operation")
        }

        console.log (`${num1} ${operator} ${num2} = ${result}`)

    </script>
</body>
</html>
