<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Celsius to Fahrenheit Conversion</title>
</head>
<body>
    <script>
        let num = parseFloat(prompt(`Enter the value: `));

        let result = num * 1.8 + 32;
        alert (`${num} degreeCelsius is: ${result} Fahrenheit`)
    </script>
</body>
</html>
