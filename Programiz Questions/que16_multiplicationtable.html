<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multiplication Table</title>
</head>
<body>
    <script>
        let num = parseInt(prompt(`Enter the number: `));
        let mult;

        for (let i=1; i<=10; i++) {
            mult=num*i
            console.log(`${num}*${i} = ${mult}`)
        }
        
    </script>
</body>
</html>
