<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sum of natural numbers</title>
</head>
<body>
    <script>
        let num = parseInt (prompt(`Enter the number: `));
        let sum = 0; 

        for (i=1; i<=num; i++) {
            sum += i; 
        }
        console.log(sum)
    </script>
</body>
</html>
