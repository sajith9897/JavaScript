<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vowels in a string</title>
</head>
<body>
    <script>
        function result(str) {
            let ros = str.match(/[a,e,i,o,u]/gi).length;
            return ros
        }
        let string = "Hi i am fine.";

        console.log(result(string))
    </script>
</body>
</html>
