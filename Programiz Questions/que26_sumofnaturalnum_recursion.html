<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sum of natural numbers using recursion</title>
</head>
<body>
    <script>
        function sum (a) {
            if (a > 0) {
               return a + sum(a-1);
            }
            else {
                return a;
            }
        }

        let inp = parseInt(prompt(`Enter the number: `))

        console.log (sum(inp))
    </script>
</body>
</html>
