<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Even Number</title>
</head>
<body>
    <script>
        let arr = [9,8,7,6,5,4,3,2,1]

        // Odd number finding  
        console.log ("ODD NUMBERS")
        for (let i=0; i<arr.length; i++) {

            if (arr[i]%2 !==0){
                console.log (arr[i])
            }
        }


        // Even number finding 
        console.log ("EVEN NUMBERS")
        for (let i=0; i<arr.length; i++) {

            if (arr[i]%2==0){
                console.log (arr[i])
            }
        }
    </script>
</body>
</html>
