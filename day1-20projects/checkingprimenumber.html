<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let num= parseInt(prompt(`Enter the number: `));
        let isPrime = true;

        for (let i=2; i<num; i++) {
            if (num % i == 0) {
                isPrime = false;
                break;
            }
        }
        if (isPrime) {
            console.log(`${num} is Prime`)
        }
        else {
            console.log(`${num} is not Prime`)
        }
        
    </script>
</body>
</html>
