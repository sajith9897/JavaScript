<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Range of Prime Number</title>
</head>
<body>
    <script>
        let rangeone= parseInt(prompt(`Enter the starting range: `));
        let rangetwo= parseInt(prompt(`Enter the ending range: `));
        let isPrime = true;
        
        for (let j=rangeone; j<=rangetwo; j++) {

            isPrime = true;


            for (let i=2; i<j; i++) {
                if (j % i == 0) {
                    isPrime = false;
                    break;
                }
            }
            if (isPrime) {
                console.log(j)
            }
        }   
    </script>
</body>
</html>
