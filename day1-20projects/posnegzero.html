<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let num = prompt(`Enter a number: `);

        if (num>0) {
            console.log(`The entered number is a Positive Number`)
        }
        else if (num ==0 ) {
            console.log(`The entered number is Zero`)
        }
        else {
            console.log(`The entered number is a Negative Number`)
        }
    </script>
</body>
</html>
