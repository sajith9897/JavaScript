<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Odd Or Even Number</title>
</head>
<body>
    <script>
        let num = prompt(`Enter a number: `);

        if (num % 2 ==0) {
            console.log(`The entered number is a Even Number`)
        }
        else {
            console.log(`The entered number is a Odd Number`)
        }
    </script>
</body>
</html>
