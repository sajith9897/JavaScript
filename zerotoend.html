<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let numbers = [3,0,7,0,5];
        let zero = [];
        let result = [];

        for (let i=0; i<numbers.length; i++) {
            if (numbers[i]==0) {
                zero.push(numbers[i]);
            }
            else {
                result.push(numbers[i]);
            }
        }
        result =result.concat(zero);

        console.log (result)
    </script>
</body>
</html>
