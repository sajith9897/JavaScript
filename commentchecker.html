<!DOCTYPE html>
<html>
<head>
    <title>Comment Checker</title>
</head>

<body>

    <p id="display"></p>

    <script>

        let comment = "My son is 12 years old. Our flat number is 45 and contact is 9876543210.";

        let numberFound = /\d/.test(comment);

        let updatedComment = comment.replace(/\d+/g, "NUMBER");

        document.getElementById("display").innerHTML =
            "Number found: " + numberFound + "<br><br>" +
            "Updated comment: " + updatedComment;

    </script>

</body>
</html>
