<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kilometers to miles</title>
</head>
<body>
    <script>
        let km= prompt(`Enter the Kilometer  value: `);
        let result= km * 0.621371;

        alert(`${km}KM = ${result}miles.`)
    </script>
</body>
</html>
