<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JSON</title>
</head>
<body>
    <script>
        let txt = `{
            "name":"Akhil", 
            "email":"akhil@gmail.com",
            "message":"HelloAkhil"
        }`;

        let printMessage;

        printMessage = (text) => {
            try {
                let user = JSON.parse(txt);

                console.log(`Message received from ${user.name}`);
            }
            catch (err) {
                console.log("Error: invalid JSON");
            }
        }

        printMessage (txt)
    </script>
</body>
</html>
