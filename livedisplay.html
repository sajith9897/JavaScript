<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Display</title>
</head>
<body>
    <input type="text" name="text" id="input1">

    <script>
        let input = document.getElementById("input1")
        let output = document.getElementById("para")

        input.addEventListener("input", display)

        function display () { 
            document.getElementById("para").innerHTML= document.getElementById("input1").value;
        }
    </script>
    <p id="para"></p>
</body>
</html>
