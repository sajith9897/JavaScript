<!DOCTYPE html>
<html>
<head>
    <title>Feedback Form</title>
</head>
<body>

    <form id="feedbackForm">

        <input type="text" id="name" placeholder="Enter your name" required>
        <br><br>

        <textarea id="feedback" placeholder="Enter your feedback" required></textarea>
        <br><br>

        <button type="submit">Submit</button>

    </form>

    <p id="display"></p>
    <p id="message"></p>


    <script>

        let form = document.getElementById("feedbackForm");
        let name = document.getElementById("name");
        let feedback = document.getElementById("feedback");
        let display = document.getElementById("display");
        let message = document.getElementById("message");


        form.addEventListener("submit", function(event) {

            event.preventDefault();

            display.innerHTML =
                "Name: " + name.value +
                "<br>Feedback: " + feedback.value;

            display.style.color = "black";

            message.innerHTML = "Thanks for your feedback!";
            message.style.color = "green";


            setTimeout(function() {
                message.innerHTML = "";
            }, 5000);

        });


        display.addEventListener("mouseover", function() {
            display.style.color = "blue";
        });


        display.addEventListener("mouseout", function() {
            display.style.color = "black";
        });

    </script>

</body>
</html>
