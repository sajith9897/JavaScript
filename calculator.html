<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
</head>
<body>
    <script>
        for (let i = 1; i <= 5; i++) {

    let code = Number(prompt("Enter product code (1-3):"));
    let quantity = Number(prompt("Enter quantity:"));

    let price;
    let product;

    switch (code) {
        case 1:
            product = "Apple";
            price = 30;
            break;

        case 2:
            product = "Banana";
            price = 10;
            break;

        case 3:
            product = "Mango";
            price = 50;
            break;

        default:
            console.log("Invalid product code!");
            continue;
    }

    let total = price * quantity;

    console.log("Product:", product);
    console.log("Quantity:", quantity);
    console.log("Total Price: ₹" + total);

    if (total > 100) {
        console.log("High purchase");
    } else {
        console.log("Normal purchase");
    }

    console.log("-------------------");
}
    </script>
</body>
</html>
